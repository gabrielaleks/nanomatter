services:
  controller:
    build:
      context: .
      dockerfile: ./controller/Dockerfile
      target: development
    container_name: nanomatter-controller
    network_mode: host # required for mDNS multicast (Matter device discovery) # uncomment!
    # ports: # should be used only for development - do not commit.
    #   - '3000:3000'
    volumes:
      - ./controller:/controller
      - ./controller/matter-storage:/matter
      - ./db:/db
    environment:
      - MATTER_STORAGE_PATH=/matter

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: development
    container_name: nanomatter-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/frontend
